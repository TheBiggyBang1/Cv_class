# Blueprint Render : New > Blueprint, puis choisir ce dépôt.
services:
  - type: web
    name: cv-class
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: ANTHROPIC_API_KEY   # demandée à la création, jamais dans le dépôt
        sync: false
      - key: APP_PASSWORD        # mot de passe de l'interface, demandé à la création
        sync: false
      - key: CV_MODEL
        value: claude-sonnet-5-5
      - key: ECOLE_ELIMINATOIRE
        value: "false"
